<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicación | Masa & Fuego</title>
    <meta
      name="description"
      content="Formulario de aplicación de Masa & Fuego para conocer tu perfil y recomendarte el programa de cocina ideal."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Masa & Fuego",
        "url": "https://masayfuego.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "admissions",
          "email": "hola@masayfuego.com",
          "telephone": "+34-600-000-000"
        }
      }
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-b from-amber-50 via-white to-slate-100 text-slate-900 antialiased">
    <header class="border-b border-slate-200 bg-white/80 backdrop-blur" aria-label="Cabecera del formulario">
      <div class="mx-auto flex w-full max-w-5xl items-center justify-between px-6 py-4">
        <a href="index.html" class="text-xl font-black tracking-tight text-amber-700">Masa & Fuego</a>
        <nav aria-label="Navegación" class="flex items-center gap-4 text-sm font-semibold">
          <a href="index.html" class="text-slate-600 transition hover:text-amber-700">Landing</a>
          <span aria-current="page" class="text-slate-900">Aplicación</span>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-5xl px-6 py-10" aria-label="Formulario de aplicación">
      <section class="mb-8">
        <h1 class="text-3xl font-black sm:text-4xl">Formulario de aplicación</h1>
        <p class="mt-3 max-w-2xl text-slate-600">
          Cuéntanos sobre ti para evaluar tu perfil y ayudarte a entrar al programa que mejor se adapte a tus objetivos.
        </p>
      </section>

      <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div
          id="formStatus"
          class="mb-6 hidden rounded-xl border px-4 py-3 text-sm"
          role="status"
          aria-live="polite"
        ></div>

        <form id="applicationForm" novalidate class="grid gap-6">
          <fieldset class="grid gap-4">
            <legend class="mb-2 text-lg font-bold text-slate-900">Datos personales</legend>

            <div>
              <label for="fullName" class="mb-1 block text-sm font-semibold">Nombre completo *</label>
              <input
                id="fullName"
                name="fullName"
                type="text"
                autocomplete="name"
                class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="fullNameError"
              />
              <p id="fullNameError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="email" class="mb-1 block text-sm font-semibold">Correo electrónico *</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                  aria-describedby="emailError"
                />
                <p id="emailError" class="mt-1 hidden text-sm text-rose-600"></p>
              </div>

              <div>
                <label for="phone" class="mb-1 block text-sm font-semibold">Teléfono *</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                  aria-describedby="phoneError"
                />
                <p id="phoneError" class="mt-1 hidden text-sm text-rose-600"></p>
              </div>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="birthDate" class="mb-1 block text-sm font-semibold">Fecha de nacimiento *</label>
                <input
                  id="birthDate"
                  name="birthDate"
                  type="date"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                  aria-describedby="birthDateError"
                />
                <p id="birthDateError" class="mt-1 hidden text-sm text-rose-600"></p>
              </div>

              <div>
                <label for="city" class="mb-1 block text-sm font-semibold">Ciudad de residencia *</label>
                <input
                  id="city"
                  name="city"
                  type="text"
                  autocomplete="address-level2"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                  aria-describedby="cityError"
                />
                <p id="cityError" class="mt-1 hidden text-sm text-rose-600"></p>
              </div>
            </div>
          </fieldset>

          <fieldset class="grid gap-4 border-t border-slate-200 pt-6">
            <legend class="mb-2 text-lg font-bold text-slate-900">Perfil culinario y aplicación</legend>

            <div>
              <label for="experienceLevel" class="mb-1 block text-sm font-semibold">Nivel de experiencia en cocina *</label>
              <select
                id="experienceLevel"
                name="experienceLevel"
                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="experienceLevelError"
              >
                <option value="">Selecciona una opción</option>
                <option value="beginner">Principiante</option>
                <option value="intermediate">Intermedio</option>
                <option value="advanced">Avanzado</option>
                <option value="professional">Profesional en activo</option>
              </select>
              <p id="experienceLevelError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div>
              <label for="interestArea" class="mb-1 block text-sm font-semibold">Área de interés principal *</label>
              <select
                id="interestArea"
                name="interestArea"
                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="interestAreaError"
              >
                <option value="">Selecciona una opción</option>
                <option value="bakery">Panadería y masas</option>
                <option value="pastry">Pastelería</option>
                <option value="hot-kitchen">Cocina caliente</option>
                <option value="healthy">Cocina saludable</option>
                <option value="entrepreneurship">Emprendimiento gastronómico</option>
              </select>
              <p id="interestAreaError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div>
              <label for="schedule" class="mb-1 block text-sm font-semibold">Disponibilidad horaria *</label>
              <select
                id="schedule"
                name="schedule"
                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="scheduleError"
              >
                <option value="">Selecciona una opción</option>
                <option value="weekdays-morning">Lunes a viernes - Mañana</option>
                <option value="weekdays-evening">Lunes a viernes - Tarde/Noche</option>
                <option value="weekend">Fines de semana</option>
                <option value="flexible">Flexible</option>
              </select>
              <p id="scheduleError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div>
              <label for="motivation" class="mb-1 block text-sm font-semibold">¿Por qué quieres formarte con nosotros? *</label>
              <textarea
                id="motivation"
                name="motivation"
                rows="4"
                class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="motivationError"
              ></textarea>
              <p id="motivationError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div>
              <label for="goals" class="mb-1 block text-sm font-semibold">Objetivo principal (académico/profesional) *</label>
              <textarea
                id="goals"
                name="goals"
                rows="3"
                class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
                aria-describedby="goalsError"
              ></textarea>
              <p id="goalsError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>

            <div>
              <label for="allergies" class="mb-1 block text-sm font-semibold">Alergias o restricciones alimentarias (opcional)</label>
              <textarea
                id="allergies"
                name="allergies"
                rows="2"
                class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
              ></textarea>
            </div>
          </fieldset>

          <fieldset class="grid gap-4 border-t border-slate-200 pt-6">
            <legend class="mb-2 text-lg font-bold text-slate-900">Consentimiento</legend>
            <div>
              <label class="inline-flex items-start gap-3 text-sm text-slate-700" for="acceptTerms">
                <input
                  id="acceptTerms"
                  name="acceptTerms"
                  type="checkbox"
                  class="mt-1 h-4 w-4 rounded border-slate-300 text-amber-600 focus:ring-amber-500"
                  aria-describedby="acceptTermsError"
                />
                <span>Acepto que mis datos sean usados para gestionar mi aplicación y recibir información de programas. *</span>
              </label>
              <p id="acceptTermsError" class="mt-1 hidden text-sm text-rose-600"></p>
            </div>
          </fieldset>

          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-xs text-slate-500">* Campos obligatorios</p>
            <button
              type="submit"
              class="rounded-full bg-slate-900 px-6 py-3 text-sm font-bold text-white transition hover:bg-slate-800"
            >
              Enviar aplicación
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-white">
      <div class="mx-auto flex max-w-5xl flex-col gap-2 px-6 py-6 text-sm text-slate-600 sm:flex-row sm:items-center sm:justify-between">
        <p>© 2026 Masa & Fuego</p>
        <a href="index.html" class="font-semibold text-amber-700 hover:text-amber-800">Volver a la landing</a>
      </div>
    </footer>

    <script src="validation.js" defer></script>
  </body>
</html>
